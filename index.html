<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tạo link Shopee - layma.hoimagiamgia.com</title>
    <meta name="description" content="Công cụ tạo link Shopee nhanh chóng">

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script
        src="https://platform-api.sharethis.com/js/sharethis.js#property=676aca77d5bedc001907e6b3&product=sticky-share-buttons"
        async></script>
    <link rel="stylesheet" href="style.css">
</head>

<body cz-shortcut-listen="true">
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-link mr-2"></i>Tạo Link Shopee</h1>
            <div class="domain-badge">
                <font dir="auto" style="vertical-align: inherit;">
                    <font dir="auto" style="vertical-align: inherit;">layma.hoimagiamgia.com</font>
                </font>
            </div>
        </div>

        <div class="main-card">
            <div class="card-content">
                <form id="link-form">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-shopping-bag mr-2"></i>Link sản phẩm Shopee
                        </label>
                        <div class="input-group">
                            <input type="url" class="form-control" id="input_url"
                                placeholder="Dán link Shopee vào đây..." required="">
                            <div class="input-group-append">
                                <span class="input-group-text" id="btnPaste">
                                    <i class="fas fa-paste"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom btn-custom btn-block" id="btnSubmit">
                        <i class="fas fa-magic mr-2"></i>
                        <span class="btn-text">Tạo Link Ngay</span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <div id="result-section" class="result-section">
                    <div class="link-box">
                        <div class="link-box-header">
                            <strong><i class="fas fa-check-circle text-success mr-2"></i>Link của bạn</strong>
                            <button class="copy-btn" id="btnCopy">
                                <i class="fas fa-copy mr-1"></i>
                                <font dir="auto" style="vertical-align: inherit;">
                                    <font dir="auto" style="vertical-align: inherit;">Sao chép
                                    </font>
                                </font>
                            </button>
                        </div>
                        <div id="affiliate-link"></div>
                    </div>

                    <div class="action-buttons">
                        <a class="btn btn-success-custom btn-custom" id="btnBuy" href="#" target="_blank">
                            <i class="fas fa-shopping-cart mr-2"></i>Mua Ngay
                        </a>
                        <a class="btn btn-info-custom btn-custom" id="btnShare"
                            href="https://www.facebook.com/share/p/18GJbtM5Ju/" target="_blank">
                            <i class="fab fa-facebook mr-2"></i>Chia sẻ
                        </a>
                    </div>

                    <div id="product-info-box" class="product-info-box">
                        <div class="product-info-header">
                            <h6><i class="fas fa-info-circle mr-2"></i>Thông tin sản phẩm</h6>
                        </div>
                        <div id="product-info-content"></div>
                    </div>
                </div>
            </div>

            <!-- Default Instructions -->
            <div class="instructions-box">
                <h6>
                    <i class="fas fa-info-circle text-primary mr-2"></i>Hướng dẫn
                </h6>
                <ol>
                    <li>Sau khi tạo link, nhấn <b>Copy Link</b>.</li>
                    <li>Dán link dưới bình luận bài đăng này.</li>
                    <li>Click vào link để mở Shopee sẽ nhận được mã.</li>
                </ol>
                <div class="instructions-content">
                    <a href="https://www.facebook.com/share/p/18GJbtM5Ju/" target="_blank"
                        class="btn btn-outline-primary btn-sm instructions-link">
                        <i class="fab fa-facebook mr-2"></i>Đến bài đăng Facebook
                    </a>
                    <br>
                    <img src="image.png" alt="image hướng dẫn"
                        class="instructions-image">
                </div>
            </div>

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>

</html>
